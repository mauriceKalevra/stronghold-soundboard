<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crusader Soundboard – Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0C0803;
  --stone:#1B130A;
  --stone-lit:#2A1E11;
  --edge:#4B3719;
  --edge-soft:#33240f;
  --parchment:#F0E2C0;
  --ink:#B69C71;
  --ink-dim:#7d6844;
  --brass:#D8A441;
  --brass-soft:#9E7726;
  --blood:#8E2B22;
  --ember:#C4382B;
  --ember-lit:#D9452F;
  --ember-dark:#6E1B14;
  --oasis:#3E8C7A;
  --rad:3px;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'Spectral', Georgia, 'Times New Roman', serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0a0806;
  background-image:radial-gradient(80% 60% at 50% 0%, #1a1409 0%, #0a0806 60%);
  font-family:var(--body);
  color:var(--parchment);
  display:flex; align-items:center; justify-content:center;
  padding:26px 16px;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.caption{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-dim);
  margin:0;text-align:center;max-width:420px;line-height:1.7
}
.phone{
  position:relative;width:392px;height:812px;max-height:calc(100vh - 90px);
  padding:11px;border-radius:40px;
  background:linear-gradient(160deg,#3a2f22,#0d0b08 55%);
  box-shadow:0 40px 90px rgba(0,0,0,.75), inset 0 0 0 1px #59462c;
}
.viewport{
  position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;
  background:var(--night);
  isolation:isolate;
}
/* Pixel-Wüste als Hintergrund */
.desert{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background-repeat:no-repeat;background-size:cover;background-position:50% 100%;
  image-rendering:crisp-edges;image-rendering:pixelated;
}
.desert::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(8,6,3,.86) 0%, rgba(8,6,3,.62) 26%,
    rgba(8,6,3,.40) 52%, rgba(8,6,3,.58) 78%, rgba(8,6,3,.84) 100%);
  transition:background .5s ease
}
.desert.dim::after{background:rgba(8,6,3,.9)}
.viewport::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:var(--night);
}
.viewport::after{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column}
.screen.in{animation:slideIn .26s cubic-bezier(.2,.7,.3,1)}
.screen.inBack{animation:slideInBack .26s cubic-bezier(.2,.7,.3,1)}
@keyframes slideIn{from{transform:translateX(26%);opacity:0}to{transform:none;opacity:1}}
@keyframes slideInBack{from{transform:translateX(-18%);opacity:0}to{transform:none;opacity:1}}

/* ---------- Ladebildschirm ---------- */
.loader{align-items:center;justify-content:center;text-align:center;padding:0 28px}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--brass-soft);margin:0 0 18px
}
.logo{
  font-family:var(--display);font-weight:700;font-size:34px;line-height:1.06;margin:0;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--parchment);
  text-shadow:0 2px 0 #000, 0 0 26px rgba(216,164,65,.25)
}
.logo span{display:block;font-size:15px;letter-spacing:.4em;color:var(--brass);margin-top:10px;font-weight:500}
.barframe{
  position:absolute;left:28px;right:28px;bottom:88px;
  height:17px;padding:2px;border-radius:2px;
  background:#0B0703;border:1px solid #6B5730;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.85), 0 1px 0 rgba(255,220,170,.08)
}
.barfill{
  display:block;height:100%;width:0;border-radius:1px;
  background:linear-gradient(180deg,var(--ember-lit) 0%, var(--ember) 55%, var(--ember-dark) 100%);
  box-shadow:inset 0 1px 0 rgba(255,190,170,.4), 0 0 14px rgba(217,69,47,.45)
}
.loadtext{font-size:13px;color:var(--ink);margin:0;min-height:20px;
  position:absolute;left:28px;right:28px;bottom:116px;text-align:center;
  font-family:var(--mono);letter-spacing:.04em}
.torch{position:absolute;top:46%;width:16px;height:16px;border-radius:50%;filter:blur(7px);
  background:radial-gradient(circle,#ffcf7a,#c96a12 55%,transparent 70%);animation:flicker 2.6s infinite}
.torch.left{left:34px}
.torch.right{right:34px;animation-delay:-1.1s}
@keyframes flicker{0%,100%{opacity:.5;transform:scale(1)}35%{opacity:.85;transform:scale(1.25)}60%{opacity:.42;transform:scale(.95)}}
.gate{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;background:rgba(8,6,3,.92);
  border:0;color:var(--parchment);font-family:var(--display);letter-spacing:.22em;
  text-transform:uppercase;font-size:14px;cursor:pointer
}
.gate small{font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-dim);max-width:220px;line-height:1.5}

/* ---------- App-Leiste ---------- */
.appbar{
  position:relative;flex:0 0 auto;min-height:76px;display:flex;align-items:center;gap:12px;
  padding:24px 14px 12px;
  background:linear-gradient(180deg,#241A0E,#170F07);
  border-bottom:1px solid var(--edge);
}
.appbar::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:1px;background:linear-gradient(90deg,transparent,var(--brass-soft),transparent);opacity:.6}
.iconbtn{
  flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;border-radius:var(--rad);
  background:transparent;border:1px solid transparent;color:var(--ink);cursor:pointer
}
.iconbtn:hover{border-color:var(--edge);color:var(--brass);background:#20170c}
.titles{flex:1;min-width:0}
.titles h2{
  font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  margin:0;color:var(--parchment);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.titles p{margin:3px 0 0;font-size:12px;color:var(--ink-dim);font-family:var(--mono);letter-spacing:.04em}
.pennant{flex:0 0 auto;width:4px;height:30px;border-radius:1px;background:var(--blood)}
.pennant.sarazenen{background:var(--oasis)}

.content{position:relative;flex:1;overflow-y:auto;padding:16px 14px 96px;scrollbar-width:thin}
.sectionlabel{
  font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink-dim);margin:4px 2px 12px;display:flex;align-items:center;gap:10px
}
.sectionlabel::after{content:'';flex:1;height:1px;background:var(--edge-soft)}

/* ---------- Kacheln ---------- */
.tile{
  position:relative;display:flex;align-items:center;gap:13px;width:100%;
  padding:15px 14px;margin-bottom:10px;overflow:hidden;
  background:linear-gradient(180deg,var(--stone-lit),var(--stone));
  border:1px solid var(--edge);border-radius:var(--rad);
  box-shadow:inset 0 1px 0 rgba(255,222,166,.09), 0 2px 0 rgba(0,0,0,.55);
  color:var(--parchment);font-family:var(--body);font-size:16px;text-align:left;cursor:pointer;
  transition:transform .08s ease
}
.tile::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s ease;
  background:radial-gradient(70% 130% at 50% -25%, rgba(216,164,65,.20), transparent 72%)
}
.tile:hover::after{opacity:1}
.tile:active{transform:translateY(1px)}
.tile .lbl{flex:1;min-width:0}
.tile .lbl b{display:block;font-weight:600;font-size:16px;letter-spacing:.01em}
.tile .lbl span{display:block;margin-top:3px;font-size:12px;color:var(--ink-dim);font-family:var(--mono)}
.tile .chev{color:var(--brass-soft);flex:0 0 auto}
.glyph{flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;color:var(--brass);
  border:1px solid var(--edge);border-radius:var(--rad);background:#150E06}

/* ---------- Sound-Kachel ---------- */
.sound{align-items:center;padding:12px 10px 12px 12px;gap:10px}
.play{
  flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:#150E06;border:1px solid var(--edge);color:var(--brass);cursor:pointer
}
.sound.playing .play{background:var(--brass);color:#1a1207;border-color:#f0c56d}
.sound .lbl .file{display:block;font-family:var(--mono);font-size:13.5px;color:var(--parchment);word-break:break-all;margin:0}
.sound.playing .lbl .file{color:var(--brass)}
.sound .lbl .sub{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-dim);font-family:var(--mono);letter-spacing:.03em}
.acts{flex:0 0 auto;display:flex;gap:2px}
.act{
  width:34px;height:34px;display:grid;place-items:center;border-radius:var(--rad);
  background:transparent;border:1px solid transparent;color:var(--ink-dim);cursor:pointer
}
.act:hover{color:var(--brass);border-color:var(--edge);background:#150E06}
.act.on{color:var(--brass)}
.act.on svg{fill:var(--brass)}
.prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--brass);opacity:.9}
.wave{display:none;gap:2px;align-items:flex-end;height:12px;margin-top:6px}
.sound.playing .wave{display:flex}
.wave i{width:2px;background:var(--brass-soft);border-radius:1px;animation:bounce .6s ease-in-out infinite}
@keyframes bounce{0%,100%{height:3px}50%{height:12px}}

/* ---------- Suche ---------- */
.search{
  display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:10px 12px;
  background:#150E06;border:1px solid var(--edge-soft);border-radius:var(--rad)
}
.search input{
  flex:1;background:transparent;border:0;outline:none;color:var(--parchment);
  font-family:var(--mono);font-size:13px
}
.search input::placeholder{color:#5f4f33}

/* ---------- Tab-Leiste ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:2;height:70px;display:flex;
  background:linear-gradient(180deg,#1B130A,#100A05);border-top:1px solid var(--edge);
  padding-bottom:6px
}
.tab{
  flex:1;background:transparent;border:0;color:var(--ink-dim);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase
}
.tab.on{color:var(--brass)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(216,164,65,.5))}

/* ---------- Leerer Zustand & Toast ---------- */
.empty{text-align:center;padding:56px 22px;color:var(--ink-dim)}
.empty h3{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--ink);margin:0 0 10px}
.empty p{font-size:14px;line-height:1.6;margin:0}
.toast{
  position:absolute;left:16px;right:16px;bottom:84px;z-index:5;
  padding:12px 14px;background:#241A0E;border:1px solid var(--edge);border-radius:var(--rad);
  font-family:var(--mono);font-size:12px;color:var(--parchment);line-height:1.5;
  box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transform:translateY(8px);
  transition:opacity .2s ease, transform .2s ease;pointer-events:none
}
.toast.show{opacity:1;transform:none}

:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
@media (max-width:640px){
  body{padding:0}
  .phone{width:100vw;height:100vh;max-height:100vh;border-radius:0;padding:0;box-shadow:none}
  .viewport{border-radius:0}
  .caption{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="viewport" id="viewport"></div>
  </div>
  <p class="caption">Prototyp · Klick-Attrappe für Android · Alle Töne sind synthetische Platzhalter, keine Originaldateien</p>
</div>

<script>
/* ============================================================
   1. DATEN  (im Prototyp erzeugt – später aus der Asset-Liste)
   ============================================================ */
const CATEGORIES = [
  {id:'characters', title:'Charaktere',  sub:'Sprüche der Gegner',      glyph:'shield'},
  {id:'narrator',   title:'Erzähler',    sub:'Kampagnen-Kommentar',     glyph:'scroll'},
  {id:'population', title:'Bevölkerung', sub:'Bauern, Markt, Jubel',    glyph:'house'},
  {id:'units',      title:'Einheiten',   sub:'Befehle und Schlachtrufe',glyph:'sword'},
  {id:'music',      title:'Musik',       sub:'Themen und Wüstenwind',   glyph:'note'}
];

const GROUPS = {
  characters:[
    {id:'richard', name:'Richard Löwenherz', prefix:'ri', side:'kreuzfahrer', role:'König von England', pitch:112},
    {id:'saladin', name:'Saladin',           prefix:'sa', side:'sarazenen',   role:'Sultan der Sarazenen', pitch:100},
    {id:'sultan',  name:'Der Sultan',        prefix:'su', side:'sarazenen',   role:'Herr der Wüstenstadt', pitch:96},
    {id:'caliph',  name:'Der Kalif',         prefix:'ca', side:'sarazenen',   role:'Freund des Feuers', pitch:152},
    {id:'emir',    name:'Der Emir',          prefix:'em', side:'sarazenen',   role:'Vorsichtiger Verteidiger', pitch:124},
    {id:'wazir',   name:'Der Wesir',         prefix:'wa', side:'sarazenen',   role:'Händler mit Hintergedanken', pitch:132},
    {id:'nizar',   name:'Nizar',             prefix:'ni', side:'sarazenen',   role:'Herr der Assassinen', pitch:118},
    {id:'sheriff', name:'Der Sheriff',       prefix:'sh', side:'kreuzfahrer', role:'Steuereintreiber', pitch:108},
    {id:'marshal', name:'Der Marschall',     prefix:'ma', side:'kreuzfahrer', role:'Turnierritter', pitch:104},
    {id:'abbot',   name:'Der Abt',           prefix:'ab', side:'kreuzfahrer', role:'Frommer Zuchtmeister', pitch:128},
    {id:'rat',     name:'Die Ratte',         prefix:'ra', side:'kreuzfahrer', role:'Feigling im Sold', pitch:176},
    {id:'snake',   name:'Die Schlange',      prefix:'sn', side:'kreuzfahrer', role:'Intrigant', pitch:142},
    {id:'pig',     name:'Das Schwein',       prefix:'pi', side:'kreuzfahrer', role:'Grobian', pitch:78},
    {id:'wolf',    name:'Der Wolf',          prefix:'wo', side:'kreuzfahrer', role:'Kriegsherr des Nordens', pitch:88},
    {id:'sultana', name:'Die Sultanin',      prefix:'sl', side:'sarazenen',   role:'Herrin der Oase', pitch:196}
  ],
  narrator:[
    {id:'narrator', name:'Erzähler', prefix:'nar', role:'Stimme der Kampagne', pitch:98,
     kinds:[['intro','Einleitung'],['mission','Auftrag'],['victory','Sieg'],['defeat','Niederlage'],['hint','Hinweis']]}
  ],
  population:[
    {id:'peasants', name:'Bauern',   prefix:'pea', role:'Volk der Burg', pitch:150,
     kinds:[['cheer','Jubel'],['boo','Unmut'],['work','Arbeit'],['hunger','Hunger']]},
    {id:'market',   name:'Markt & Handel', prefix:'mar', role:'Basar', pitch:134,
     kinds:[['buy','Kauf'],['sell','Verkauf'],['trade','Handel']]}
  ],
  units:[
    {id:'archer',    name:'Bogenschütze', prefix:'arc', role:'Fernkampf', pitch:126,
     kinds:[['select','Auswahl'],['move','Marsch'],['attack','Angriff'],['death','Tod']]},
    {id:'spearman',  name:'Speerträger',  prefix:'spe', role:'Nahkampf', pitch:110,
     kinds:[['select','Auswahl'],['move','Marsch'],['attack','Angriff']]},
    {id:'assassin',  name:'Assassine',    prefix:'ass', role:'Sarazenische Einheit', pitch:120,
     kinds:[['select','Auswahl'],['climb','Mauer'],['attack','Angriff']]},
    {id:'catapult',  name:'Katapult',     prefix:'cat', role:'Belagerung', pitch:70,
     kinds:[['load','Laden'],['fire','Schuss'],['hit','Treffer']]}
  ],
  music:[
    {id:'themes', name:'Themen & Ambiente', prefix:'mus', role:'Musikstücke', pitch:0, musical:true,
     kinds:[['theme','Thema'],['siege','Belagerung'],['oasis','Oase'],['wind','Wüstenwind']]}
  ]
};

const DEFAULT_KINDS = [
  ['anger','Wut'],['congrats','Glückwunsch'],['taunt','Spott'],['greet','Begrüßung'],
  ['attack','Angriff'],['defeat','Niederlage'],['peace','Frieden']
];

/* deterministischer Zufall, damit Listen stabil bleiben */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

const SOUNDS={};      // id -> sound
const BY_GROUP={};    // groupId -> [sound]
const GROUP_OF={};    // groupId -> group
const CAT_OF={};      // groupId -> catId

for(const cat of CATEGORIES){
  for(const g of GROUPS[cat.id]){
    GROUP_OF[g.id]=g; CAT_OF[g.id]=cat.id; BY_GROUP[g.id]=[];
    const kinds=g.kinds||DEFAULT_KINDS;
    const r=rng(hashStr(g.id));
    for(const [k,label] of kinds){
      const n=1+Math.floor(r()*2);
      for(let i=1;i<=n;i++){
        const id=`${g.prefix}_${k}_${String(i).padStart(2,'0')}`;
        const secs=g.musical? 12+Math.floor(r()*40) : 1+Math.floor(r()*5);
        const s={id, file:id+'.mp3', kind:k, label, group:g, groupId:g.id, catId:cat.id,
                 dur:`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`};
        SOUNDS[id]=s; BY_GROUP[g.id].push(s);
      }
    }
  }
}

/* ============================================================
   2. FAVORITEN  (window.storage mit Fallback)
   ============================================================ */
const mem={};
const Store={
  async get(k){ try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null}catch(e){return mem[k]??null} },
  async set(k,v){ try{await window.storage.set(k,JSON.stringify(v))}catch(e){mem[k]=v} }
};
let favs=new Set();
async function loadFavs(){ const a=await Store.get('favorites'); if(Array.isArray(a)) favs=new Set(a.filter(id=>SOUNDS[id])); }
async function saveFavs(){ await Store.set('favorites',[...favs]); }

/* ============================================================
   3. AUDIO  (synthetische Platzhalter, kein Originalmaterial)
   ============================================================ */
let AC=null, MASTER=null, muted=false, live=[];
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC }
function bus(){ if(!MASTER){MASTER=ac().createGain(); MASTER.gain.value=muted?0:.85; MASTER.connect(ac().destination)} return MASTER }
function setMuted(m){ muted=m; if(MASTER) MASTER.gain.setTargetAtTime(m?0:.85, ac().currentTime, .02) }
function noiseBuffer(){
  const c=ac(); if(c._nb) return c._nb;
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return c._nb=b;
}
function stopAll(){ live.forEach(n=>{try{n.stop(0)}catch(e){}}); live=[] }

/* stimmähnlicher Platzhalter, Tonhöhe je Sprecher */
function speak(s){
  const c=ac(), r=rng(hashStr(s.id)); let t=c.currentTime+.03;
  const base=s.group.pitch||110, start=t;
  const syll=2+Math.floor(r()*4);
  for(let i=0;i<syll;i++){
    const len=.12+r()*.16;
    const f=base*(.85+r()*.45)*(s.kind==='anger'||s.kind==='attack'?1.18:1);
    const o=c.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*(.88+r()*.32),t+len);
    const v=c.createOscillator(), vg=c.createGain();
    v.frequency.value=4.5+r()*3.5; vg.gain.value=f*.035; v.connect(vg).connect(o.frequency);
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=4.5;
    const form=380+r()*950; bp.frequency.setValueAtTime(form,t); bp.frequency.linearRampToValueAtTime(form*(.6+r()*.9),t+len);
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2500;
    const env=c.createGain(); env.gain.setValueAtTime(.0001,t);
    env.gain.exponentialRampToValueAtTime(.3,t+.03);
    env.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(bp).connect(lp).connect(env).connect(bus());
    o.start(t); o.stop(t+len+.03); v.start(t); v.stop(t+len+.03);
    live.push(o,v);
    t+=len+.03+r()*.06;
  }
  return t-start;
}
/* gezupfte Note für Musik-Platzhalter */
function pluck(freq,at,len,gain=.18){
  const c=ac();
  const o=c.createOscillator(); o.type='triangle'; o.frequency.value=freq;
  const o2=c.createOscillator(); o2.type='sawtooth'; o2.frequency.value=freq*2.01;
  const f=c.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(2400,at); f.frequency.exponentialRampToValueAtTime(500,at+len);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,at);
  g.gain.exponentialRampToValueAtTime(gain,at+.012);
  g.gain.exponentialRampToValueAtTime(.0001,at+len);
  o.connect(f); o2.connect(f); f.connect(g).connect(bus());
  o.start(at);o.stop(at+len);o2.start(at);o2.stop(at+len);
  live.push(o,o2);
}
function drum(at,gain=.22){
  const c=ac();
  const src=c.createBufferSource(); src.buffer=noiseBuffer();
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=180; bp.Q.value=1.2;
  const g=c.createGain(); g.gain.setValueAtTime(gain,at); g.gain.exponentialRampToValueAtTime(.0001,at+.16);
  src.connect(bp).connect(g).connect(bus());
  src.start(at); src.stop(at+.2); live.push(src);
}
const SCALE=[293.66,311.13,369.99,392.00,440.00,466.16,554.37,587.33]; // D-Hijaz
function playMusical(s){
  const c=ac(), r=rng(hashStr(s.id)); let t=c.currentTime+.05; const start=t;
  for(let i=0;i<14;i++){
    pluck(SCALE[Math.floor(r()*SCALE.length)]/(r()<.3?2:1), t, .5+r()*.4, .16);
    if(i%2===0) drum(t,.14);
    t+=.22+ (r()<.25?.11:0);
  }
  return t-start;
}
/* Intro-Musik: Drone + Rahmentrommel + Melodie */
let introNodes=[];
function startIntro(dur=8){
  const c=ac(), t0=c.currentTime+.05;
  const g=c.createGain(); g.gain.value=0; g.connect(bus());
  g.gain.setTargetAtTime(.5,t0,.6);
  [73.42,110.0].forEach((f,i)=>{
    const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=f*(i?1.003:1);
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320; lp.Q.value=2;
    const og=c.createGain(); og.gain.value=.09;
    o.connect(lp).connect(og).connect(g); o.start(t0); o.stop(t0+dur+1.4); introNodes.push(o);
  });
  const step=.24, r=rng(7);
  for(let i=0;i*step<dur;i++){
    const t=t0+i*step;
    if(i%4===0||i%4===3) drum(t,.2);
    if(i%2===0) pluck(SCALE[Math.floor(r()*6)], t, .55, .1);
  }
  introNodes.push(g);
  return g;
}
function stopIntro(){
  const g=introNodes[introNodes.length-1];
  if(g&&g.gain) g.gain.setTargetAtTime(0, ac().currentTime, .35);
  setTimeout(()=>{introNodes.forEach(n=>{try{n.stop&&n.stop(0)}catch(e){}}); introNodes=[]},1400);
}

/* ============================================================
   4b. PIXEL-WÜSTE  (im Browser gezeichnet, kein fremdes Bildmaterial)
   ============================================================ */
function buildDesert(){
  const W=96,H=200,UP=4;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  const R=rng(20260730);
  const px=(x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(Math.round(x),Math.round(y),w,h) };
  const disc=(cx,cy,r,col)=>{ for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++) if(x*x+y*y<=r*r) px(cx+x,cy+y,1,1,col) };

  /* Himmel: Farbbänder mit Dithering an den Übergängen */
  const HOR=118;
  const SKY=['#131B32','#1C2340','#2A2749','#3F2C4C','#5B3550','#804350','#A65647','#C87241','#E29A4E','#F3C273'];
  for(let y=0;y<HOR;y++){
    const t=y/(HOR-1)*(SKY.length-1), i=Math.floor(t), f=t-i;
    for(let x=0;x<W;x++){
      const bias=((x+y)%2===0)?-.25:.25;
      px(x,y,1,1, SKY[(f>.5+bias)?Math.min(SKY.length-1,i+1):i]);
    }
  }
  /* Sterne oben */
  for(let i=0;i<34;i++){ const x=Math.floor(R()*W), y=Math.floor(R()*54); px(x,y,1,1, R()<.4?'#D8D2B6':'#8E8C9C'); }
  /* Sonne knapp über dem Horizont */
  const sx=62, sy=113;
  g.globalAlpha=.07; disc(sx,sy,20,'#FFD9A0');
  g.globalAlpha=.09; disc(sx,sy,14,'#FFDFAC');
  g.globalAlpha=1;
  disc(sx,sy,8,'#FFDC98'); disc(sx,sy,6,'#FFEEC4'); disc(sx,sy,3,'#FFF9E4');
  /* Dunstband am Horizont */
  g.globalAlpha=.35; px(0,HOR-4,W,6,'#F0BE7E'); g.globalAlpha=1;

  /* Dünenschichten von hinten nach vorn */
  const dune=(baseY,amp,freq,phase,body,crest,shade)=>{
    let prev=null;
    for(let x=0;x<W;x++){
      const y=Math.round(baseY+Math.sin(x*freq+phase)*amp+Math.sin(x*freq*2.7+phase*1.7)*amp*.35);
      px(x,y,1,H-y,body);
      px(x,y,1,2,crest);
      if(prev!==null && y>prev && shade) px(x,y+2,1,5,shade);
      prev=y;
    }
  };
  dune(120,3.5,.09,.4,'#B9834F','#DCAE72',null);

  /* Burg auf dem hinteren Kamm – eigene Form, kein Vorbild kopiert */
  (()=>{
    const bx=20, gr=126, dark='#5A3A20', lit='#7C512C', deep='#3A2412';
    px(bx,gr-10,26,10,dark);
    for(let i=0;i<26;i+=4) px(bx+i,gr-12,2,2,dark);
    px(bx+25,gr-12,1,22,lit);
    px(bx-4,gr-17,7,17,dark); px(bx-4,gr-19,2,2,dark); px(bx+1,gr-19,2,2,dark);
    px(bx+22,gr-22,8,22,dark); px(bx+22,gr-24,2,2,dark); px(bx+26,gr-24,2,2,dark);
    px(bx+29,gr-22,1,22,lit);
    px(bx+11,gr-6,4,6,deep);
    px(bx+30,gr-30,1,8,'#4A2E18'); px(bx+31,gr-30,4,3,'#A8362A');
  })();

  dune(133,5,.075,2.1,'#9C6338','#C58A4C','#7A4A28');
  dune(152,7,.055,4.6,'#7C4C2A','#A9703C','#5E3720');
  dune(174,6,.045,1.2,'#5E3A20','#8A5730','#472A16');

  /* Palmen am Rand der Oase */
  const palm=(bx,by,h)=>{
    for(let i=0;i<h;i++){
      const off=Math.round(Math.sin(i/h*1.3)*2);
      px(bx+off,by-i,2,1, i%3===0?'#4E3218':'#5C3C1E');
    }
    const tx=bx+Math.round(Math.sin(1.3)*2), ty=by-h;
    [[-1,-.75],[1,-.75],[-1.15,-.2],[1.15,-.2],[-.55,-1.05],[.55,-1.05]].forEach(([dx,dy])=>{
      for(let s=1;s<=6;s++){
        const x=tx+Math.round(dx*s), y=ty+Math.round(dy*s+s*s*.1);
        px(x,y,1,1, s<4?'#2F5C3C':'#22452D');
      }
    });
    px(tx-1,ty+2,1,1,'#7A3B22'); px(tx+2,ty+2,1,1,'#7A3B22');
  };
  palm(12,178,17); palm(21,183,12); palm(83,193,15);

  /* Sandkörnung und Rippel im Vordergrund */
  for(let i=0;i<220;i++){
    const x=Math.floor(R()*W), y=140+Math.floor(R()*60);
    px(x,y,1+Math.floor(R()*3),1, R()<.5?'rgba(196,140,86,.5)':'rgba(58,34,16,.45)');
  }

  /* auf ganze Pixel hochskalieren, damit die Kanten hart bleiben */
  const big=document.createElement('canvas');
  big.width=W*UP; big.height=H*UP;
  const bg=big.getContext('2d');
  bg.imageSmoothingEnabled=false;
  bg.drawImage(c,0,0,big.width,big.height);
  return big.toDataURL('image/png');
}

  try{ desertEl.style.backgroundImage=`url(${buildDesert()})` }catch(e){}
  vp.appendChild(desertEl);
}

/* ---------- Wiedergabe-Zustand in der Oberfläche ---------- */
let playTimer=null, playingId=null;
function clearPlaying(){
  clearTimeout(playTimer);
  vp.querySelectorAll('.sound.playing').forEach(t=>{
    t.classList.remove('playing');
    const p=t.querySelector('.prog'); if(p){p.style.transition='none';p.style.width='0'}
    const b=t.querySelector('.play'); if(b) b.innerHTML=svg('play',18);
  });
  playingId=null;
}
function playSound(id){
  const s=SOUNDS[id];
  const again=playingId===id;
  stopAll(); clearPlaying();
  if(again) return;
  const dur=s.group.musical? playMusical(s) : speak(s);
  playingId=id;
  vp.querySelectorAll(`.sound[data-id="${id}"]`).forEach(t=>{
    t.classList.add('playing');
    t.querySelector('.play').innerHTML=svg('stop',16);
    t.querySelectorAll('.wave i').forEach((b,i)=>b.style.animationDelay=(i*0.07)+'s');
    const p=t.querySelector('.prog');
    p.style.transition='none'; p.style.width='0';
    requestAnimationFrame(()=>{p.style.transition=`width ${dur}s linear`; p.style.width='100%'});
  });
  playTimer=setTimeout(clearPlaying, dur*1000+120);
}

/* ---------- Toast ---------- */
let toastEl=null,toastT=null;
function toast(msg){
  if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; vp.appendChild(toastEl) }
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),2600);

/* ---------- Ereignisse ---------- */
vp.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  if(act!=='play') e.stopPropagation();
  switch(act){
    case 'cat': {
      const groups=GROUPS[id];
      push(groups.length===1?{v:'group',id:groups[0].id}:{v:'cat',id});
      break;
    }
    case 'group': push({v:'group',id}); break;
    case 'back': back(); break;
    case 'tab':
      tab = id==='fav'?'fav':'home';
      stack = id==='fav'?[{v:'home'},{v:'fav'}]:[{v:'home'}];
      filter=''; render(id==='fav'?'in':'inBack');
      break;
    case 'play': playSound(id); break;
    case 'fav': {
      favs.has(id)?favs.delete(id):favs.add(id);
      await saveFavs();
      const on=favs.has(id);
      vp.querySelectorAll(`.act.star[data-id="${id}"]`).forEach(b=>b.classList.toggle('on',on));
      toast(on?`${SOUNDS[id].file} zu Favoriten hinzugefügt`:`${SOUNDS[id].file} aus Favoriten entfernt`);
      if(stack[stack.length-1].v==='fav') setTimeout(()=>render(),260);
      break;
    }
    case 'dl': toast(`${SOUNDS[id].file} gespeichert – im Prototyp nur angedeutet, in der App unter „Downloads/Crusader Soundboard“`); break;
    case 'share': {
      const f=SOUNDS[id].file;
      if(navigator.share){ try{ await navigator.share({title:f,text:`Sound: ${f}`}) }catch(err){ toast(`Teilen abgebrochen`) } }
      else toast(`Android öffnet hier das Teilen-Menü mit ${f}`);
      break;
    }
    case 'mute': setMuted(!muted); render(); toast(muted?'Ton aus':'Ton an'); break;
    case 'replay': bootLoader(true); break;
  }
});
vp.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    const t=e.target.closest('.sound[data-act="play"]');
    if(t){ e.preventDefault(); playSound(t.dataset.id) }
  }
});

/* ============================================================

   ============================================================ */
const LINES=['Karawane wird beladen …','Steine werden geschlagen …','Wüstenwind zieht auf …','Tore öffnen sich …'];
const LOAD_MS=3000;   // reine Balkenzeit, danach kurzer Übergang
function bootLoader(skipGate){
  stopAll(); clearPlaying();
  const el=document.createElement('div');
  el.className='screen loader';
  el.innerHTML=`
    <p class="eyebrow">Fan-Soundboard</p>
    <h1 class="logo">Crusader<span>Soundboard</span></h1>
    <div class="torch left"></div><div class="torch right"></div>
    <p class="loadtext" id="loadtext">${LINES[0]}</p>
    <div class="barframe"><i class="barfill" id="fill"></i></div>
    ${skipGate?'':`<button class="gate" id="gate">Zum Betreten tippen<small>Browser starten Ton erst nach einer Berührung – in der App läuft die Musik sofort.</small></button>`}`;
  vp.querySelectorAll('.screen').forEach(s=>s.remove());
  vp.appendChild(el);
  if(desertEl) desertEl.classList.add('dim');

  const run=()=>{
    const fill=el.querySelector('#fill'), txt=el.querySelector('#loadtext');
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    startIntro(LOAD_MS/1000+.4);
    if(!reduce) requestAnimationFrame(()=>{
      fill.style.transition=`width ${LOAD_MS}ms linear`;
      fill.style.width='100%';
    });
    const t0=performance.now(); let li=-1;
    const poll=()=>{
      const p=Math.min(100,(performance.now()-t0)/LOAD_MS*100);
      if(reduce) fill.style.width=p+'%';
      const l=Math.min(LINES.length-1, Math.floor(p/25));
      if(l!==li){ li=l; txt.textContent=LINES[l] }
      if(p<100) requestAnimationFrame(poll);
    };
    poll();
    setTimeout(()=>{
      stopIntro();
      if(desertEl) desertEl.classList.remove('dim');
      el.style.transition='opacity .4s ease'; el.style.opacity='0';
      setTimeout(()=>{ el.remove(); stack=[{v:'home'}]; tab='home'; render('in') },420);
    }, LOAD_MS+260);
  };
  const gate=el.querySelector('#gate');
  if(gate) gate.addEventListener('click',()=>{ ac(); bus(); gate.remove(); run() });
  else { ac(); run() }
}

initDesert();
loadFavs().then(()=>bootLoader(false));
</script>
</body>
</html>
